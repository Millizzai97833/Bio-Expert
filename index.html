      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('expert_biology_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-slate-50 text-slate-900 dark:bg-[#0B1117] dark:text-slate-100 antialiased selection:bg-teal-700/15 selection:text-teal-900 dark:selection:bg-teal-400/20 dark:selection:text-teal-100">
